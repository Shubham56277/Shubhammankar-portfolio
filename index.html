<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="vaTx44el3KygILxzAvdhCVMHtKsJS55Rojwe8lqXHuQ" />
  <title>Enter — Shubham's World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- AUDIO — Replace "your-music.mp3" with your actual audio file path -->
    <source src="Sparkle.mp3" type="audio/mpeg" />
  </audio>


  <!-- Sakura Petals -->
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>
  <div class="sakura-petal lp"></div>

  <!-- Fireflies -->
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>
  <div class="firefly"></div>

  <!-- Shooting stars -->
  <div class="shooting-star ss-1"></div>
  <div class="shooting-star ss-2"></div>
  <div class="shooting-star ss-3"></div>

  <!-- Fog layers -->
  <div class="fog fog-1"></div>
  <div class="fog fog-2"></div>

  <!-- Moon glow -->
  <div class="moon">
    <div class="moon-glow"></div>
    <div class="moon-body"></div>
  </div>

  <!-- Mountain silhouettes -->
  <div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
  </div>

  <!-- Tree silhouettes -->
  <div class="tree-silhouette tree-left"></div>
  <div class="tree-silhouette tree-right"></div>

  <!-- Main content -->
  <div class="landing-content" id="landingContent">
    <div class="kanji-bg">侍</div>
    <p class="landing-kicker">✦ A Developer's Journey Awaits</p>
    <h1 class="landing-title">
      <span class="title-line line-1">Welcome to</span>
      <span class="title-line line-2">Shubham's <span class="highlight">World</span></span>
    </h1>
    <p class="landing-sub">Code. Create. Conquer.</p>
    <div class="enter-prompt">
      <div class="pulse-ring"></div>
      <div class="pulse-ring ring-2"></div>
      <span class="enter-text">Click Anywhere to Enter</span>
    </div>
    <div class="sound-hint"></div>
  </div>

  <!-- Transition overlay -->
  <div class="transition-overlay" id="transitionOverlay"></div>

  <script>
  document.body.addEventListener('click', function () {
    const overlay = document.getElementById('transitionOverlay');

    // mark user interaction
    localStorage.setItem('enteredSite', 'true');

    document.body.classList.add('exiting');
    overlay.classList.add('active');

    setTimeout(() => {
      window.location.href = 'portfolio.html';
    }, 1800);
  }, { once: true });
  </script>
</body>
</html>
